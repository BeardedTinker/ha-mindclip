list_recordings:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: mindclip
    limit:
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box

get_recording:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: mindclip
    recording_id:
      required: true
      example: "5f3a1c2e9b7d"
      selector:
        text:

get_transcript:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: mindclip
    recording_id:
      required: true
      example: "5f3a1c2e9b7d"
      selector:
        text:

get_summary:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: mindclip
    recording_id:
      required: true
      example: "5f3a1c2e9b7d"
      selector:
        text:
