name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - RELEASE_NOTES.md
      - RELEASE_TITLE
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Determine release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          manifest_version=$(python -c 'import json; print(json.load(open("custom_components/mindclip/manifest.json"))["version"])')
          expected_tag="v${manifest_version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${expected_tag}" = "${RELEASE_TAG}"
          fi
          echo "tag=${expected_tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          release_title=$(< RELEASE_TITLE)
          test -n "${release_title}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${release_title}" --notes-file RELEASE_NOTES.md
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            gh release create "${RELEASE_TAG}" --title "${release_title}" --notes-file RELEASE_NOTES.md --verify-tag
          fi
